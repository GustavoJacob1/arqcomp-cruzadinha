<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>The Legend of CPU</title>
  <rect width="16" height="16" rx="2" fill="#0c1224"/>
  <!-- pinos do chip -->
  <g fill="#ffc53d">
    <rect x="4" y="1" width="2" height="2"/><rect x="7" y="1" width="2" height="2"/><rect x="10" y="1" width="2" height="2"/>
    <rect x="4" y="13" width="2" height="2"/><rect x="7" y="13" width="2" height="2"/><rect x="10" y="13" width="2" height="2"/>
    <rect x="1" y="4" width="2" height="2"/><rect x="1" y="7" width="2" height="2"/><rect x="1" y="10" width="2" height="2"/>
    <rect x="13" y="4" width="2" height="2"/><rect x="13" y="7" width="2" height="2"/><rect x="13" y="10" width="2" height="2"/>
  </g>
  <!-- corpo e núcleo -->
  <rect x="3" y="3" width="10" height="10" fill="#38e1ff"/>
  <rect x="4" y="4" width="8" height="8" fill="#121a33"/>
  <rect x="6" y="6" width="4" height="4" fill="#ffc53d"/>
  <rect x="7" y="7" width="1" height="1" fill="#fff6d6"/>
</svg>
